<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品浪费追踪 - 智能冰箱管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #667eea; font-size: 28px; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #667eea; font-weight: 500; font-size: 14px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { display: inline-block; background: #667eea; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #764ba2; }
        .btn:disabled { background: #ccc; }
        .ai-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        input, textarea, select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-row > div { flex: 1; min-width: 150px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background: #f5f5f5; color: #667eea; font-weight: 600; }
        .loading { text-align: center; padding: 30px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .warning-box { background: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #856404; }
        .waste-card { background: #f9f9ff; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #e53935; }
        .waste-card h3 { color: #e53935; margin-bottom: 10px; }
        .waste-section { margin: 10px 0; padding: 10px; background: white; border-radius: 8px; }
        .waste-section h4 { color: #333; margin-bottom: 8px; }
        .waste-section p { color: #555; line-height: 1.6; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗑️ 食品浪费追踪</h1>
            <nav class="nav-links">
                <a th:href="@{/}">首页</a>
                <a th:href="@{/inventory}">库存</a>
                <a th:href="@{/ai/scan}">拍照识别</a>
                <a th:href="@{/ai/recipes}">AI菜谱</a>
                <a th:href="@{/ai/daily-plan}">今日菜谱</a>
                <a th:href="@{/ai/shopping-list}">购物清单</a>
                <a th:href="@{/ai/nutrition}">营养分析</a>
                <a th:href="@{/ai/waste}">浪费追踪</a>
                <a th:href="@{/logout}">退出</a>
            </nav>
        </header>

        <div class="card">
            <h2 style="color: #667eea; margin-bottom: 15px;">记录浪费</h2>
            <form th:action="@{/ai/waste}" method="post">
                <div class="form-row">
                    <div><label style="display:block; margin-bottom:5px; color:#333;">食材名称</label><input type="text" name="foodName" required></div>
                    <div><label style="display:block; margin-bottom:5px; color:#333;">数量</label><input type="number" name="quantity" step="0.1" required></div>
                    <div><label style="display:block; margin-bottom:5px; color:#333;">单位</label><input type="text" name="unit" value="个"></div>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; color:#333;">浪费原因</label>
                    <textarea name="reason" placeholder="例如：过期、变质、做多了..."></textarea>
                </div>
                <button type="submit" class="btn">📝 记录浪费</button>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="color: #667eea;">📊 浪费记录</h2>
                <button class="btn" id="analyzeBtn" onclick="analyzeWaste()">🤖 AI分析减少浪费</button>
            </div>

            <div th:if="${#lists.isEmpty(wastes)}">
                <p style="text-align: center; color: #999; padding: 30px;">暂无浪费记录，继续保持！</p>
            </div>

            <table th:if="${not #lists.isEmpty(wastes)}">
                <thead>
                    <tr>
                        <th>食材</th>
                        <th>数量</th>
                        <th>日期</th>
                        <th>原因</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="w : ${wastes}">
                        <td th:text="${w.foodName}"></td>
                        <td th:text="${w.quantity} + ' ' + ${w.unit}"></td>
                        <td th:text="${w.wasteDate}"></td>
                        <td th:text="${w.reason}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p style="color: #667eea;">AI正在分析浪费数据...</p>
        </div>

        <div id="result" style="display: none;">
            <div class="card">
                <h2 style="color: #667eea; margin-bottom: 15px;"><span class="ai-badge">AI</span> 减少浪费建议</h2>
                <div id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        function analyzeWaste() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = true;

            fetch('/ai/waste/analyze', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyzeBtn').disabled = false;
                if (data.success) {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('resultContent').innerHTML = formatWasteAnalysis(data.aiResponse);
                } else {
                    alert(data.message);
                }
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyzeBtn').disabled = false;
                alert('请求失败：' + err.message);
            });
        }

        function formatWasteAnalysis(response) {
            try {
                let data = response;
                if (typeof response === 'string') {
                    const match = response.match(/\{[\s\S]*\}/);
                    if (match) data = JSON.parse(match[0]);
                    else return '<div style="white-space:pre-line; color:#555;">' + response + '</div>';
                }

                let html = '';
                if (data.waste_analysis) html += '<div class="waste-card"><h3>📊 浪费分析</h3><p style="white-space:pre-line; color:#555;">' + data.waste_analysis + '</p></div>';
                if (data.main_reasons) {
                    html += '<div class="waste-card"><h3>🔍 主要原因</h3>';
                    data.main_reasons.forEach(r => html += '<p style="margin:5px 0; color:#555;">• ' + r + '</p>');
                    html += '</div>';
                }
                if (data.suggestions) {
                    html += '<div class="waste-card" style="border-left-color:#4caf50;"><h3 style="color:#4caf50;">💡 减少浪费的建议</h3>';
                    data.suggestions.forEach(s => html += '<p style="margin:5px 0; color:#555;">• ' + s + '</p>');
                    html += '</div>';
                }
                if (data.shopping_tips) {
                    html += '<div class="waste-card" style="border-left-color:#2196f3;"><h3 style="color:#2196f3;">🛒 购物建议</h3>';
                    data.shopping_tips.forEach(t => html += '<p style="margin:5px 0; color:#555;">• ' + t + '</p>');
                    html += '</div>';
                }
                if (data.storage_tips) {
                    html += '<div class="waste-card" style="border-left-color:#ff9800;"><h3 style="color:#ff9800;">📦 储存建议</h3>';
                    data.storage_tips.forEach(t => html += '<p style="margin:5px 0; color:#555;">• ' + t + '</p>');
                    html += '</div>';
                }
                return html || '<div style="white-space:pre-line; color:#555;">' + JSON.stringify(data, null, 2) + '</div>';
            } catch (e) {
                return '<div style="white-space:pre-line; color:#555;">' + response + '</div>';
            }
        }
    </script>
</body>
</html>
