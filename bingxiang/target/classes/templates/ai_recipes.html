<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI菜谱推荐 - 智能冰箱管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #667eea; font-size: 28px; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #667eea; font-weight: 500; font-size: 14px; }
        .nav-links a:hover { color: #764ba2; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { display: inline-block; background: #667eea; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #764ba2; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-sm { padding: 8px 16px; font-size: 14px; }
        .btn-green { background: #4caf50; }
        .btn-green:hover { background: #388e3c; }
        textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; font-family: inherit; min-height: 80px; resize: vertical; }
        textarea:focus { outline: none; border-color: #667eea; }
        .ingredients-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .ingredient-tag { background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
        .ai-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .recipe-card { background: #f9f9ff; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #667eea; }
        .recipe-card h3 { color: #667eea; margin-bottom: 10px; font-size: 20px; }
        .recipe-meta { display: flex; gap: 15px; margin-bottom: 10px; color: #666; font-size: 14px; }
        .recipe-section { margin: 10px 0; padding: 10px; background: white; border-radius: 8px; }
        .recipe-section h4 { color: #333; margin-bottom: 8px; }
        .recipe-section p { color: #555; line-height: 1.6; white-space: pre-line; }
        .loading { text-align: center; padding: 30px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .warning-box { background: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #856404; }
        .fav-btn { background: #ff9800; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-top: 10px; }
        .fav-btn:hover { background: #f57c00; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍳 AI菜谱推荐</h1>
            <nav class="nav-links">
                <a th:href="@{/}">首页</a>
                <a th:href="@{/inventory}">库存</a>
                <a th:href="@{/ai/scan}">拍照识别</a>
                <a th:href="@{/ai/recipes}">AI菜谱</a>
                <a th:href="@{/ai/daily-plan}">今日菜谱</a>
                <a th:href="@{/ai/shopping-list}">购物清单</a>
                <a th:href="@{/ai/nutrition}">营养分析</a>
                <a th:href="@{/ai/favorites}">收藏</a>
                <a th:href="@{/logout}">退出</a>
            </nav>
        </header>

        <div th:if="${!aiConfigured}" class="warning-box">
            ⚠️ AI服务未配置。请在 <code>application.properties</code> 中设置 <code>doubao.api.key</code>
        </div>

        <div class="card">
            <h2 style="color: #667eea; margin-bottom: 15px;"><span class="ai-badge">AI</span> 根据冰箱食材智能推荐菜谱</h2>

            <div class="ingredients-list">
                <span th:each="item : ${items}" class="ingredient-tag" th:text="${item.foodName} + '(' + ${item.quantity} + ${item.unit} + ')'"></span>
                <span th:if="${#lists.isEmpty(items)}" style="color: #999;">冰箱暂无食材，请先添加</span>
            </div>

            <div style="margin: 15px 0;">
                <label style="color: #333; font-weight: 500; margin-bottom: 8px; display: block;">饮食偏好（可选）</label>
                <textarea id="preferences" placeholder="例如：不吃辣、低脂、素食、清淡口味..."></textarea>
            </div>

            <button class="btn" id="generateBtn" onclick="generateRecipes()">
                🤖 AI生成菜谱推荐
            </button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p style="color: #667eea;">AI正在思考菜谱，请稍候...</p>
        </div>

        <div id="result" style="display: none;">
            <div class="card">
                <h2 style="color: #667eea; margin-bottom: 15px;"><span class="ai-badge">AI</span> 推荐菜谱</h2>
                <div id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        function generateRecipes() {
            const preferences = document.getElementById('preferences').value;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('generateBtn').disabled = true;

            const formData = new FormData();
            formData.append('preferences', preferences);

            fetch('/ai/recipes', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generateBtn').disabled = false;
                if (data.success) {
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('resultContent').innerHTML = formatRecipes(data.aiResponse);
                } else {
                    alert(data.message);
                }
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generateBtn').disabled = false;
                alert('请求失败：' + err.message);
            });
        }

        function formatRecipes(response) {
            try {
                let data = response;
                if (typeof response === 'string') {
                    const match = response.match(/\[[\s\S]*\]/);
                    if (match) data = JSON.parse(match[0]);
                    else return '<div class="recipe-card"><p>' + response.replace(/\n/g, '<br>') + '</p></div>';
                }
                if (!Array.isArray(data)) data = [data];

                let html = '';
                data.forEach((recipe, i) => {
                    html += '<div class="recipe-card">';
                    html += '<h3>🍽️ ' + (recipe.name || '菜谱' + (i+1)) + '</h3>';
                    html += '<div class="recipe-meta">';
                    if (recipe.difficulty) html += '<span>📊 ' + recipe.difficulty + '</span>';
                    if (recipe.cooking_time) html += '<span>⏱️ ' + recipe.cooking_time + '分钟</span>';
                    html += '</div>';
                    if (recipe.ingredients) html += '<div class="recipe-section"><h4>🥗 所需食材</h4><p>' + recipe.ingredients + '</p></div>';
                    if (recipe.seasonings) html += '<div class="recipe-section"><h4>🧂 所需调料</h4><p>' + recipe.seasonings + '</p></div>';
                    if (recipe.steps) html += '<div class="recipe-section"><h4>📝 详细做法</h4><p>' + recipe.steps + '</p></div>';
                    if (recipe.nutrition) html += '<div class="recipe-section"><h4>💪 营养价值</h4><p>' + recipe.nutrition + '</p></div>';
                    if (recipe.tips) html += '<div class="recipe-section"><h4>💡 烹饪小贴士</h4><p>' + recipe.tips + '</p></div>';
                    html += '<button class="fav-btn" onclick="saveFavorite(\'' + (recipe.name || '').replace(/'/g, "\\'") + '\')">⭐ 收藏菜谱</button>';
                    html += '</div>';
                });
                return html;
            } catch (e) {
                return '<div class="recipe-card"><p>' + response.replace(/\n/g, '<br>') + '</p></div>';
            }
        }

        function saveFavorite(name) {
            const content = document.getElementById('resultContent').innerText;
            fetch('/ai/favorite-recipe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'recipeName=' + encodeURIComponent(name) + '&content=' + encodeURIComponent(content)
            })
            .then(r => r.json())
            .then(data => alert(data.message))
            .catch(err => alert('收藏失败'));
        }
    </script>
</body>
</html>
